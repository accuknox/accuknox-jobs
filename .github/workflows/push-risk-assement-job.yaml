name: build k8s-risk-assessment-job image workflow

on:
  push:
    tags:
    - '*'
    branches:
    - "main"

jobs:
  push_to_registry:
    name: Push risk-assessment Docker image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        
      - name: Set up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to AWS ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/k9v9d5v2
          
      - name: Determine version
        id: vars
        env:
          VERSION_FILE: kspm-jobs/k8s-risk-assessment-job/risk-assessment-version.txt
        run: |
          VERSION=""
          if [ -f "$VERSION_FILE" ]; then
            # strip all whitespace/newlines so a blank or newline-only file counts as empty
            VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          fi

          if [ -n "$VERSION" ]; then
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" == "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set git ssh private key
        run: echo "${{ secrets.GIT_KEY }}" > GIT-KEY

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # equivalent of make docker-build
          context: kspm-jobs/k8s-risk-assessment-job
          file: kspm-jobs/k8s-risk-assessment-job/Dockerfile
          push: true
          tags: public.ecr.aws/k9v9d5v2/k8s-risk-assessment:${{ steps.vars.outputs.tag }}
