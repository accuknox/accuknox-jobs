name: KSPM Runtime Air-Gapped Bundle

on:
  workflow_run:
    workflows:
      - KSPM-Runtime Workflow
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      IMAGE_PLATFORM: linux/amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0

      - name: Install YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3'

      - name: Download published Helm chart
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: published-kspm-runtime-chart
          path: bundle
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build Helm dependencies
        if: github.event_name == 'workflow_dispatch'
        run: helm dependency build kspm-runtime

      - name: Package Helm chart for manual bundle
        if: github.event_name == 'workflow_dispatch'
        run: helm package kspm-runtime --destination bundle

      - name: Prepare bundled Helm chart
        run: |
          set -euo pipefail
          charts=(bundle/kspm-runtime-*.tgz)
          if (( ${#charts[@]} != 1 )) || [[ ! -f "${charts[0]}" ]]; then
            echo "::error::Expected exactly one packaged kspm-runtime chart"
            exit 1
          fi
          helm show chart "${charts[0]}" > bundle/chart-metadata.yaml
          mkdir -p rendered-chart
          tar -xzf "${charts[0]}" -C rendered-chart

      - name: Render all enabled components
        working-directory: rendered-chart/kspm-runtime
        run: |
          set -euo pipefail
          helm template kspm-runtime . \
            --set global.agents.enabled=true \
            --set kubearmor-operator.enabled=true \
            --set global.cis.enabled=true \
            --set global.riskassessment.enabled=true \
            --set global.kiem.enabled=true \
            --set admissionController.enabled=true \
            --set kyverno.enabled=true \
            --set global.inClusterScan.enabled=true \
            --include-crds > ../../bundle/kspm-runtime-all.yaml

      - name: Prepare container and database lists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import yaml

          bundle = Path("bundle")
          selection = yaml.safe_load(Path(".github/workflows/air_gapped_images.txt").read_text())
          manifest = (bundle / "kspm-runtime-all.yaml").read_text()
          references = set(re.findall(r'(?:public\.ecr\.aws/k9v9d5v2|docker\.io/kubearmor)/[\w.:/@+-]+', manifest))
          images = set()
          for repository in selection["images"]:
              matches = {ref for ref in references if ref.startswith((repository + ":", repository + "@"))}
              if not matches:
                  raise SystemExit(f"Selected image not found in chart render: {repository}")
              images.update(matches)

          chart = Path("rendered-chart/kspm-runtime")
          operator = chart / "charts/kubearmor-operator"
          if not operator.is_dir():
              operator = next((chart / "charts").glob("kubearmor-operator-*.tgz"))
          metadata = yaml.safe_load(subprocess.check_output(["helm", "show", "chart", str(operator)]))
          values = yaml.safe_load(subprocess.check_output(["helm", "show", "values", str(operator)]))
          overrides = yaml.safe_load((chart / "values.yaml").read_text())["kubearmor-operator"]
          for item in selection["kubearmor"]:
              key = item["config"]
              config = dict(values["kubearmor"]["images"][key])
              config.update(overrides.get("kubearmor", {}).get("images", {}).get(key, {}))
              tag = metadata["version"] if item.get("useChartVersion") and not overrides.get("imagePinning", values["imagePinning"]) else config["tag"]
              images.add(f'{item["repository"]}:{tag}')

          databases = set()
          def collect(node):
              if isinstance(node, dict):
                  if node.get("name") in ("TRIVY_DB_REPOSITORY", "TRIVY_JAVA_DB_REPOSITORY"):
                      databases.update(ref.strip() for ref in node.get("value", "").split(",") if ref.strip())
                  for value in node.values():
                      collect(value)
              elif isinstance(node, list):
                  for value in node:
                      collect(value)
          for document in yaml.safe_load_all(manifest):
              if isinstance(document, dict) and document.get("kind") != "CustomResourceDefinition":
                  collect(document)
          if not databases:
              raise SystemExit("No Trivy database repositories found in chart render")
          (bundle / "images.txt").write_text("\n".join(sorted(images)) + "\n")
          (bundle / "trivy-db-references.txt").write_text("\n".join(sorted(databases)) + "\n")
          print("Container images:\n" + (bundle / "images.txt").read_text())
          print("Database artifacts:\n" + (bundle / "trivy-db-references.txt").read_text())
          PY

      - name: Install ORAS for database artifacts
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.1

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to AWS Public ECR
        run: |
          set -euo pipefail
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Pull every image and save Docker archive
        run: |
          set -euo pipefail
          mapfile -t images < bundle/images.txt
          for image in "${images[@]}"; do
            max_attempts=5
            delay=30
            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              if docker pull --platform "$IMAGE_PLATFORM" "$image"; then
                break
              fi
              if (( attempt == max_attempts )); then
                echo "::error::Failed to pull $image after $max_attempts attempts"
                exit 1
              fi
              echo "::warning::Pull failed for $image (attempt $attempt/$max_attempts). Retrying in ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
            done
          done
          docker image inspect "${images[@]}" > bundle/image-metadata.json
          docker save --output bundle/images.tar "${images[@]}"
          printf '%s\n' "$IMAGE_PLATFORM" > bundle/platform.txt

      - name: Save Trivy databases as OCI layouts
        run: |
          set -euo pipefail
          mkdir -p bundle/trivy-databases
          : > bundle/trivy-db-layouts.tsv
          index=0
          while IFS= read -r reference; do
            layout="trivy-databases/db-${index}"
            oras cp --to-oci-layout "$reference" "bundle/${layout}:database"
            printf '%s\t%s\n' "$reference" "$layout" >> bundle/trivy-db-layouts.tsv
            index=$((index + 1))
          done < bundle/trivy-db-references.txt

      - name: Create bundle and checksums
        run: |
          set -euo pipefail
          (cd bundle && sha256sum kspm-runtime-all.yaml images.txt images.tar image-metadata.json platform.txt chart-metadata.yaml kspm-runtime-*.tgz trivy-db-references.txt trivy-db-layouts.tsv > SHA256SUMS && find trivy-databases -type f -exec sha256sum {} + | sort >> SHA256SUMS)
          chart_version=$(python3 -c 'import yaml; print(yaml.safe_load(open("bundle/chart-metadata.yaml"))["version"])')
          if [[ ! "$chart_version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.+-]*$ ]]; then
            echo "::error::Invalid chart version for bundle filename"
            exit 1
          fi
          bundle_file="kspm-runtime-air-gapped-bundle-${chart_version}.tar.gz"
          tar -czf "$bundle_file" -C bundle .
          sha256sum "$bundle_file" > "$bundle_file.sha256"
          printf 'BUNDLE_FILE=%s\n' "$bundle_file" >> "$GITHUB_ENV"

      - name: Upload air-gapped bundle
        uses: actions/upload-artifact@v4
        with:
          name: kspm-runtime-air-gapped-bundle-${{ github.run_id }}
          path: |
            ${{ env.BUNDLE_FILE }}
            ${{ env.BUNDLE_FILE }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload bundle to Hetzner Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_KEY }}
          AWS_SESSION_TOKEN: ''
          AWS_DEFAULT_REGION: eu-central
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing HETZNER_ACCESS_KEY secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing HETZNER_SECRET_KEY secret}"
          ENDPOINT="https://nbg1.your-objectstorage.com"
          BUCKET="accuknox-onprem-artifacts"
          destination="s3://${BUCKET}/kspm-runtime/airgapped-bundle"
          aws --endpoint-url "$ENDPOINT" s3 cp \
            "$BUNDLE_FILE" \
            "$destination/$BUNDLE_FILE" --only-show-errors
          aws --endpoint-url "$ENDPOINT" s3 cp \
            "$BUNDLE_FILE.sha256" \
            "$destination/$BUNDLE_FILE.sha256" --only-show-errors
