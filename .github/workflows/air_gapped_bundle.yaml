name: KSPM Runtime Air-Gapped Bundle

on:
  workflow_run:
    workflows:
      - KSPM-Runtime Workflow
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      IMAGE_PLATFORM: linux/amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0

      - name: Install YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3'

      - name: Download published Helm chart
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: published-kspm-runtime-chart
          path: bundle
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build Helm dependencies
        if: github.event_name == 'workflow_dispatch'
        run: helm dependency build kspm-runtime

      - name: Package Helm chart for manual bundle
        if: github.event_name == 'workflow_dispatch'
        run: helm package kspm-runtime --destination bundle

      - name: Prepare bundled Helm chart
        run: |
          set -euo pipefail
          charts=(bundle/kspm-runtime-*.tgz)
          if (( ${#charts[@]} != 1 )) || [[ ! -f "${charts[0]}" ]]; then
            echo "::error::Expected exactly one packaged kspm-runtime chart"
            exit 1
          fi
          helm show chart "${charts[0]}" > bundle/chart-metadata.yaml
          mkdir -p rendered-chart
          tar -xzf "${charts[0]}" -C rendered-chart

      - name: Render all enabled components
        working-directory: rendered-chart/kspm-runtime
        run: |
          set -euo pipefail
          helm template kspm-runtime . \
            --set global.agents.enabled=true \
            --set kubearmor-operator.enabled=true \
            --set global.cis.enabled=true \
            --set global.riskassessment.enabled=true \
            --set global.kiem.enabled=true \
            --set admissionController.enabled=true \
            --set kyverno.enabled=true \
            --set global.inClusterScan.enabled=true \
            --include-crds > ../../bundle/kspm-runtime-all.yaml

      - name: Extract unique image references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          images = set()

          def collect(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "image" or str(key).endswith("Image"):
                          if isinstance(value, str) and value.strip():
                              images.add(value.strip())
                      collect(value)
                  # Operators can create workloads using images configured in env.
                  name = str(node.get("name", ""))
                  value = node.get("value")
                  if name.endswith("_IMAGE") and isinstance(value, str) and value.strip():
                      images.add(value.strip())
              elif isinstance(node, list):
                  for item in node:
                      collect(item)

          with Path("bundle/kspm-runtime-all.yaml").open() as manifest:
              for document in yaml.safe_load_all(manifest):
                  if isinstance(document, dict) and document.get("kind") != "CustomResourceDefinition":
                      collect(document)

          if not images:
              raise SystemExit("No container images found in the rendered manifests")
          for image in images:
              if any(character.isspace() for character in image):
                  raise SystemExit(f"Invalid image reference: {image!r}")
          Path("bundle/images.txt").write_text("\n".join(sorted(images)) + "\n")
          print(f"Found {len(images)} unique images:")
          print(Path("bundle/images.txt").read_text())
          PY

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to AWS Public ECR
        run: |
          set -euo pipefail
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Pull every image and save Docker archive
        run: |
          set -euo pipefail
          mapfile -t images < bundle/images.txt
          for image in "${images[@]}"; do
            max_attempts=5
            delay=30
            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              if docker pull --platform "$IMAGE_PLATFORM" "$image"; then
                break
              fi
              if (( attempt == max_attempts )); then
                echo "::error::Failed to pull $image after $max_attempts attempts"
                exit 1
              fi
              echo "::warning::Pull failed for $image (attempt $attempt/$max_attempts). Retrying in ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
            done
          done
          docker image inspect "${images[@]}" > bundle/image-metadata.json
          docker save --output bundle/images.tar "${images[@]}"
          printf '%s\n' "$IMAGE_PLATFORM" > bundle/platform.txt

      - name: Create bundle and checksums
        run: |
          set -euo pipefail
          (cd bundle && sha256sum kspm-runtime-all.yaml images.txt images.tar image-metadata.json platform.txt chart-metadata.yaml kspm-runtime-*.tgz > SHA256SUMS)
          chart_version=$(python3 -c 'import yaml; print(yaml.safe_load(open("bundle/chart-metadata.yaml"))["version"])')
          if [[ ! "$chart_version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.+-]*$ ]]; then
            echo "::error::Invalid chart version for bundle filename"
            exit 1
          fi
          bundle_file="kspm-runtime-air-gapped-bundle-${chart_version}.tar.gz"
          tar -czf "$bundle_file" -C bundle .
          sha256sum "$bundle_file" > "$bundle_file.sha256"
          printf 'BUNDLE_FILE=%s\n' "$bundle_file" >> "$GITHUB_ENV"

      - name: Upload air-gapped bundle
        uses: actions/upload-artifact@v4
        with:
          name: kspm-runtime-air-gapped-bundle-${{ github.run_id }}
          path: |
            ${{ env.BUNDLE_FILE }}
            ${{ env.BUNDLE_FILE }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload bundle to Hetzner Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ''
          AWS_DEFAULT_REGION: ${{ secrets.HETZNER_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          HETZNER_ENDPOINT_URL: ${{ secrets.HETZNER_ENDPOINT_URL }}
          HETZNER_BUCKET: ${{ secrets.HETZNER_BUCKET }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing HETZNER_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing HETZNER_SECRET_ACCESS_KEY secret}"
          : "${AWS_DEFAULT_REGION:?Missing HETZNER_REGION secret}"
          : "${HETZNER_ENDPOINT_URL:?Missing HETZNER_ENDPOINT_URL secret}"
          : "${HETZNER_BUCKET:?Missing HETZNER_BUCKET secret}"
          destination="s3://${HETZNER_BUCKET}/kspm-runtime/airgapped-bundle"
          aws --endpoint-url "$HETZNER_ENDPOINT_URL" s3 cp \
            "$BUNDLE_FILE" \
            "$destination/$BUNDLE_FILE" --only-show-errors
          aws --endpoint-url "$HETZNER_ENDPOINT_URL" s3 cp \
            "$BUNDLE_FILE.sha256" \
            "$destination/$BUNDLE_FILE.sha256" --only-show-errors
