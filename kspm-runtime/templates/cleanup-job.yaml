{{- if .Values.cleanup.enabled }}
---

# Cleanup Job with Security Best Practices
# This pre-delete hook ensures all cluster-scoped resources are cleaned up on helm uninstall
# Security: Uses resourceNames to restrict permissions to only specific named resources
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup-sa-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"  
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cleanup-role-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "delete", "list", "watch"]
    resourceNames:
      # Kubeshield CRDs
      - "clusterscans.kubeshield.accuknox.com"
      - "discoveries.kubeshield.accuknox.com"
      - "imagescans.kubeshield.accuknox.com"
      - "scheduleclusterscans.kubeshield.accuknox.com"
      # Admission CRD
      - "admissionpolicies.admission.accuknox.com"
      # KubeArmor CRDs
      - "kubearmorpolicies.security.kubearmor.com"
      - "kubearmorhostpolicies.security.kubearmor.com"
      - "kubearmorclusterpolicies.security.kubearmor.com"
      - "kubearmorconfigs.operator.kubearmor.com"
      - "kubearmornetworkpolicies.security.kubearmor.com"
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "delete", "list", "watch"]
    resourceNames:
      # KubeArmor ClusterRoleBindings
      - "kubearmor-operator-clusterrolebinding"
      - "kubearmor-operator-clusterrole-binding"
      - "kubearmor-operator-manage-controller-clusterrole-binding"
      - "kubearmor-operator-manage-kubearmor-clusterrole-binding"
      - "kubearmor-operator-manage-relay-clusterrole-binding"
      - "kubearmor-clusterrolebinding"
      - "kubearmor-controller-clusterrolebinding"
      - "kubearmor-relay-clusterrolebinding"
      - "kubearmor-snitch-binding"
      - "agents-cleanup-rolebinding"

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "delete", "list", "watch"]
    resourceNames:
      - "kubearmor-clusterrole"
      - "kubearmor-controller-clusterrole"
      - "kubearmor-relay-clusterrole"
      - "kubearmor-snitch"

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "delete", "list", "watch"]
    resourceNames:
      - "agents-kyverno"

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "delete", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete", "list", "watch"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "delete", "list", "watch"]
    resourceNames:
      - "agents-kyverno-svc.agents.svc.kyverno-tls-ca"
      - "agents-kyverno-svc.agents.svc.kyverno-tls-pair"
      - "kyverno-cleanup-controller.agents.svc.kyverno-tls-ca"
      - "kyverno-cleanup-controller.agents.svc.kyverno-tls-pair"

  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["get", "delete", "list", "watch"]

  - apiGroups: ["admission.accuknox.com"]
    resources: ["admissionpolicies"]
    verbs: ["get", "delete", "list", "watch"]

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["get", "delete", "list", "watch"]
    resourceNames:
      - "kubearmor-controller-leader-election-role"

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "delete", "list", "watch"]
    resourceNames:
      - "kubearmor-controller-leader-election-rolebinding"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup-rolebinding-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-cleanup-role-{{ .Release.Revision }}
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup-sa-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup-job-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: {{ .Release.Name }}-cleanup-{{ .Release.Revision }}
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup-sa-{{ .Release.Revision }}
      restartPolicy: Never
      containers:
        - name: cleanup
          image: {{ .Values.registryName }}/kubectl:latest

          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Starting cleanup process..."

              ###########################################################
              # STEP 1 - Delete Kyverno deployments
              ###########################################################
              echo "Deleting Kyverno deployments..."

              kubectl delete deployment --ignore-not-found=true -n {{ .Release.Namespace }} \
                kyverno-admission-controller \
                kyverno-background-controller \
                kyverno-cleanup-controller \
                kyverno-reports-controller

              echo "Waiting for controllers to stop..."

              kubectl wait --for=delete pod \
                -l app.kubernetes.io/name=kyverno \
                -n {{ .Release.Namespace }} \
                --timeout=100s || true

              ###########################################################
              # STEP 2 - Delete Kyverno webhook configurations
              ###########################################################

              echo "Deleting Kyverno webhook configurations..."

              kubectl delete validatingwebhookconfiguration --ignore-not-found=true \
                kyverno-cel-exception-validating-webhook-cfg \
                kyverno-cleanup-validating-webhook-cfg \
                kyverno-exception-validating-webhook-cfg \
                kyverno-global-context-validating-webhook-cfg \
                kyverno-policy-validating-webhook-cfg \
                kyverno-resource-validating-webhook-cfg \
                kyverno-ttl-validating-webhook-cfg || true

              kubectl delete mutatingwebhookconfiguration --ignore-not-found=true \
                kyverno-policy-mutating-webhook-cfg \
                kyverno-resource-mutating-webhook-cfg \
                kyverno-verify-mutating-webhook-cfg || true

              echo "Waiting for webhook configurations deletion..."         
              sleep 20

              ###########################################################
              # STEP 3 - Delete leftover TLS secrets and ConfigMaps
              ###########################################################

              echo "Deleting leftover Kyverno TLS secrets..."

              kubectl delete secret --ignore-not-found=true -n {{ .Release.Namespace }} \
                agents-kyverno-svc.agents.svc.kyverno-tls-ca \
                agents-kyverno-svc.agents.svc.kyverno-tls-pair \
                kyverno-cleanup-controller.agents.svc.kyverno-tls-ca \
                kyverno-cleanup-controller.agents.svc.kyverno-tls-pair

              echo "Deleting leftover ConfigMaps..."

              kubectl delete configmap --ignore-not-found=true -n {{ .Release.Namespace }} \
                agents-kyverno

              ###########################################################
              # STEP 4 - Delete Kubeshield CRDs
              ###########################################################

              echo "Deleting Kubeshield CRDs..."

              kubectl delete crd --ignore-not-found=true \
                clusterscans.kubeshield.accuknox.com \
                discoveries.kubeshield.accuknox.com \
                imagescans.kubeshield.accuknox.com \
                scheduleclusterscans.kubeshield.accuknox.com

              ###########################################################
              # STEP 5 - Delete Admission Policies and CRDs
              ###########################################################

              echo "Deleting Admission Policies..."

              kubectl delete admissionpolicies.admission.accuknox.com \
                --all --ignore-not-found=true || true

              echo "Deleting AdmissionPolicy CRD..."

              kubectl delete crd --ignore-not-found=true \
                admissionpolicies.admission.accuknox.com

              ###########################################################
              # STEP 6 - Delete KubeArmor deployments
              ###########################################################

              kubectl delete deployment -n {{ .Release.Namespace }} \
                kubearmor-controller \
                kubearmor-operator \
                kubearmor-relay \
                accuknox-knoxguard-controller-manager \
                kubeshield-controller-manager \
                --ignore-not-found=true

              kubectl wait --for=delete pod \
                -n {{ .Release.Namespace }} \
                -l control-plane=controller-manager \
                --timeout=100s || true

              ###########################################################
              # STEP 7 - Delete KubeArmor CRDs
              ###########################################################

              echo "Deleting KubeArmor CRDs..."

              kubectl delete crd --ignore-not-found=true \
                kubearmorpolicies.security.kubearmor.com \
                kubearmorhostpolicies.security.kubearmor.com \
                kubearmorclusterpolicies.security.kubearmor.com \
                kubearmorconfigs.operator.kubearmor.com \
                kubearmornetworkpolicies.security.kubearmor.com

              ###########################################################
              # STEP 8 - Delete ClusterRoleBindings
              ###########################################################

              echo "Deleting KubeArmor ClusterRoleBindings..."

              kubectl delete clusterrolebinding --ignore-not-found=true \
                kubearmor-operator-clusterrolebinding \
                kubearmor-operator-clusterrole-binding \
                kubearmor-operator-manage-controller-clusterrole-binding \
                kubearmor-operator-manage-kubearmor-clusterrole-binding \
                kubearmor-operator-manage-relay-clusterrole-binding \
                kubearmor-clusterrolebinding \
                kubearmor-controller-clusterrolebinding \
                kubearmor-relay-clusterrolebinding \
                kubearmor-snitch-binding

              ###########################################################
              # STEP 9 - Delete ClusterRoles
              ###########################################################

              echo "Deleting KubeArmor ClusterRoles..."

              kubectl delete clusterrole --ignore-not-found=true \
                kubearmor-clusterrole \
                kubearmor-controller-clusterrole \
                kubearmor-relay-clusterrole \
                kubearmor-snitch

              ###########################################################
              # STEP 10 - Delete leftover Roles/RoleBindings
              ###########################################################

              echo "Deleting leftover Roles..."

              kubectl delete role --ignore-not-found=true -n {{ .Release.Namespace }} \
                kubearmor-controller-leader-election-role

              echo "Deleting leftover RoleBindings..."

              kubectl delete rolebinding --ignore-not-found=true -n {{ .Release.Namespace }} \
                kubearmor-controller-leader-election-rolebinding

              echo "Cleanup completed successfully!"

{{- end }}
