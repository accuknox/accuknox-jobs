# Global values that apply to the entire chart or sub-charts
global:
  secretManagedByParent: true
  leaseManagedByParent: true
  
  enableJobsUrl: false
  tenantId: ""
  authToken: "" 
  cronTab: ""
  label: ""
  clusterName: ""
  secretName: ""
  url: ""

  spire:
    secretName: "spire-agent-secret"
    
  certBundlePath: ""  # Set this for cert local path if needed .
  certBundleURL: ""  # Set this for cert URL if needed (if certBundlePath is set as well certBundlePath will take precedent)
  useInsecureConnection: false  # Set to true if insecure connection is needed


  # To use existing secret updated {registry.secretName} with your secret name.
  registry: 
    url: ""
    secretName: ""
    username: ""
    password: ""
    preserveUpstream: true

# Values specific to agents sub-chart
  agents:
    enabled: false
    accessKey: ""
    enableSpire: true
    enablePps: true
    enableKnoxGateway: true
    url: ""
    joinToken: ""
    clusterName: ""

#OnlyChartsNeedsToBeInstall
  localRegistryAgent: false
  
# Values specific to KSPM-jobs sub-charts
  cis:
    enabled: false  
    toolConfig:
      platform: ""  
      nodeType: "worker"
      targets: ""
      benchmark: ""
      check: ""
      skip: ""
  riskassessment:
    enabled: false  
  kiem:
    enabled: false 

  inClusterScan:
    enabled: false

# Values specific to KubeArmorOperator sub-chart
kubearmor-operator:
  enabled: false
  autoDeploy: false

# Values specific to knoxguard and kyverno sub-charts
admissionController:
  enabled: false

kyverno:
  enabled: false
  

