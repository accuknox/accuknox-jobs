registryName: public.ecr.aws/k9v9d5v2

# Global values that apply to the entire chart or sub-charts
global:
  secretManagedByParent: true
  leaseManagedByParent: true

  enableJobsUrl: false
  tenantId: ""
  authToken: ""
  cronTab: ""
  label: ""
  clusterName: ""
  secretName: ""
  url: ""
  airgapped: false

  talosEnv: false
  cis:
    toolConfig:
      platform: ""
      nodeType: ""
      targets: ""
      benchmark: ""
      check: ""
      skip: ""

  spire:
    secretName: "spire-agent-secret"

  SingleEndpointDeployment: false

  certEnabled: false   #Set this for cert need to be enabled
  certSecretName: ""  #we need to pass a secret name the cert will be stored in this secret.
  certPath: ""  # Set this for cert local path if needed .
  certURL: ""  # Set this for cert URL if needed (if certPath is set as well certPath will take precedent)
  skipTLSVerification: true  # Set to true if insecure connection is needed

  # To use existing secret updated {registry.secretName} with your secret name.
  registry:
    url: ""
    secretName: ""
    username: ""
    password: ""
    preserveUpstream: true

# Values specific to agents sub-chart
  agents:
    enabled: false
    accessKey: ""
    enableSpire: true
    enablePps: true
    enableKnoxGateway: true
    url: ""
    joinToken: ""
    clusterName: ""
    tokenURL: ""
    feeder:
      gatekeeper: false

  spireHost: ""
  spirePort: 443
  healthPort: 9090

  ppsHost: ""
  ppsPort: ""

  knoxGatewayHost: ""
  knoxGatewayPort: 443

  cspmHost: ""
  cspmPort: 443

#OnlyChartsNeedsToBeInstall
  localRegistryAgent: false

# Values specific to KSPM-jobs sub-charts
  cis:
    enabled: false
    toolConfig:
      platform: ""
      nodeType: "worker"
      targets: ""
      benchmark: ""
      check: ""
      skip: ""
  riskassessment:
    enabled: false
  kiem:
    enabled: false
  costManager:
    enabled: false
  inClusterScan:
    enabled: false
    sbom:
      enabled: false
      standard: ""
  nodeSelector: {} # Node selector for scheduling the job --set nodeSelector."kubernetes.io/os"=linux
  tolerations: [] # Tolerations for scheduling pods on tainted nodes e.g. --set global.tolerations[0].key=dedicated --set global.tolerations[0].operator=Equal --set global.tolerations[0].value=accuknox --set global.tolerations[0].effect=NoSchedule

# Values specific to KubeArmorOperator sub-chart
kubearmor-operator:
  enabled: false
  autoDeploy: false
  imagePinning: false
  registry:
    secretName: ""
# kubearmor images
  kubearmor:
    repo: kubearmor #(default to kubearmor)
    images:
      kubearmor:
        image: kubearmor
        tag: stable
      kubearmorInit:
        image: kubearmor-init
        tag: stable
      kubearmorRelay:
        image: kubearmor-relay-server
        tag: latest
      kubearmorController:
        image: kubearmor-controller
        tag: latest
      kubearmorSnitch:
        image: kubearmor-snitch
        tag: latest
      kubearmorOperator:
        image: kubearmor-operator
        tag: latest

  kubearmorConfig:
    kubearmorInitImage:
      imagePullPolicy: IfNotPresent
    kubearmorImage:
      imagePullPolicy: IfNotPresent
    kubearmorControllerImage:
      imagePullPolicy: IfNotPresent
    kubearmorRelayImage:
      imagePullPolicy: IfNotPresent

# Values specific to knoxguard and kyverno sub-charts
admissionController:
  enabled: false

kyverno:
  enabled: false
  webhooksCleanup:
    enabled: false

# Cleanup configuration for helm uninstall
# Uses restricted RBAC with resourceNames for security (least privilege)
# Note: KubeArmor namespace must be deleted manually for security
cleanup:
  enabled: true

# skip TLS verification by default
kubeshield-chart:
  scan:
    secure_conn: "false"
    trivyConfig:
      useTrivyAsPkg: true

# Upstream OpenCost chart overrides. Installed only by global.costManager.enabled.
costmanager:
  # Preserve existing resource names and selectors when aliasing the dependency.
  nameOverride: opencost
  # Avoid overlapping pods attaching the ReadWriteOnce volume during upgrades.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  exporter:
    replicas: 1
    # Unset when pricing is disabled; force the custom provider when enabled.
    env:
      - name: USE_CUSTOM_PROVIDER
        valueFrom:
          configMapKeyRef:
            name: accuknox-opencost-custom-pricing
            key: CustomPricesEnabled
            optional: true
    collectorDataSource:
      enabled: true
    persistence:
      enabled: true
      mountPath: /mnt/export
      accessMode: ReadWriteOnce
      storageClass: "" # Use the cluster's default StorageClass.
      size: 10Gi
  prometheus:
    internal:
      enabled: false
    external:
      enabled: false
    amp:
      enabled: false
    thanos:
      enabled: false
  metrics:
    serviceMonitor:
      enabled: false
  customPricing:
    # Enable to replace provider pricing with the rates below.
    enabled: false
    configmapName: accuknox-opencost-custom-pricing
    createConfigmap: true
    provider: custom
    costModel:
      CustomPricesEnabled: "true"
      # ISO 4217 currency code. All custom rates must be supplied in this currency.
      # This sets the currency; it does not convert prices using exchange rates.
      currencyCode: USD
      description: Custom pricing configuration for AccuKnox cost manager.
      # Upstream example rates; replace with your actual rates before enabling.
      # CPU: per core-hour; RAM/storage: per GiB-hour; GPU: per GPU-hour.
      CPU: "1.25"
      RAM: "0.50"
      GPU: "0.95"
      storage: "0.25"
      # Network prices per GiB, classified by destination.
      zoneNetworkEgress: "0.01"
      regionNetworkEgress: "0.01"
      internetNetworkEgress: "0.12"
