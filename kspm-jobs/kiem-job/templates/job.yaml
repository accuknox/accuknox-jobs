apiVersion: batch/v1
kind: Job
metadata:
  name: kiem-job-{{ now | unixEpoch }}
  namespace: {{ .Release.Namespace }}
spec:
  # keep the job for 2 hours after successful completion
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        job: kiem-job-{{ now | unixEpoch }}
        app: scanner
    spec:
    {{- if .Values.global.registry.secretName }}
      imagePullSecrets:
      - name: {{ .Values.global.registry.secretName }}-kiem
    {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.global.tolerations }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      {{- end }}
      initContainers:
        - name: kiem-init
          image: "{{ include "kiem.image" . }}"
          args: ["./kiem", "run", "--mode", "k8s", "--output", "/data/report.json"]
          env:
            - name: CLUSTER_NAME
              value: "{{ .Values.global.clusterName }}"
          volumeMounts:
            - name: datapath
              mountPath: /data
      containers:
        - image: "{{ include "cluster_job.image" . }}"
          args:
          - -config 
          - /jobs/conf/app.yaml
          imagePullPolicy: Always
          name: accuknox-kiem-job
          volumeMounts:
            - mountPath: /data
              name: datapath  
            - name: secret-volume
              mountPath: /secrets/tokens
              readOnly: true
            - name: config
              mountPath: /jobs/conf/app.yaml
              subPath: app.yaml
            {{- if eq (include "spire.enabled" . ) "true" }}     
            - name: config
              mountPath: /jobs/spire/agent.conf
              subPath: agent.conf 
            - name: spirepath
              mountPath: /run/spire/agent
            {{- end }}         
      volumes:
        - name: datapath
          emptyDir: {}
        - name: secret-volume
          secret:
            secretName: {{ .Values.global.secretName | default "jobs-token" }}
        - name: config
          configMap:
            name: kiem-config-{{ .Release.Name }}
        {{- if eq (include "spire.enabled" . ) "true" }}   
        - name: spirepath
          emptyDir: {}
        {{- end }}
      restartPolicy: OnFailure
      serviceAccount: kiem-service-account