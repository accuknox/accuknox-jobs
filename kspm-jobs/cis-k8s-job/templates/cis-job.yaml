apiVersion: batch/v1
kind: Job
metadata:
  name: cis-k8s-job-{{ now | unixEpoch }}
  namespace: {{ .Release.Namespace }}
spec:
  # keep the job for 2 hours after successful completion
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      name: cis-k8s-job-{{ now | unixEpoch }}
      labels:
        job-name: cis-k8s-job-{{ now | unixEpoch }}
        app: scanner
    spec:
    {{- if or (or (contains "master" .Values.global.cis.toolConfig.nodeType) (contains "controlplane" .Values.global.cis.toolConfig.nodeType)) (or (contains "master" .Values.global.cis.toolConfig.targets) (contains "controlplane" .Values.global.cis.toolConfig.targets)) }}
      {{- include "masterConfig" .Values.global.cis.toolConfig | trim | nindent 6 }}
    {{- end }}
      {{- if .Values.global.registry.secretName }}
      imagePullSecrets:
      - name: {{ .Values.global.registry.secretName }}-cis
      {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.global.tolerations }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      {{- end }}
      serviceAccount: cis-service-account
      containers:
      - image: "{{ include "cluster_job.image" . }}"
        args: 
        - -config 
        - /jobs/conf/app.yaml
        name: cis-k8s-cronjob
        imagePullPolicy: Always
        volumeMounts:
        - mountPath: /data
          name: datapath
        - name: secret-volume
          mountPath: /secrets/tokens
          readOnly: true
        - name: config
          mountPath: /jobs/conf/app.yaml
          subPath: app.yaml
        {{- if eq (include "spire.enabled" . ) "true" }}  
        - name: config
          mountPath: /jobs/spire/agent.conf
          subPath: agent.conf 
        - name: spirepath
          mountPath: /run/spire/agent
        {{- end }}
      initContainers:
      - image: "{{ include "kubeBench.image" . }}"
        command:
        {{- include "cmd" .Values.global.cis.toolConfig | trim | nindent 9 }}
        name: kube-bench
        volumeMounts:
        {{- include "volumeMounts" (dict "platform" .Values.global.cis.toolConfig.platform "targets" .Values.global.cis.toolConfig.targets "benchmark" .Values.global.cis.toolConfig.benchmark "check" .Values.global.cis.toolConfig.check "skip" .Values.global.cis.toolConfig.skip "talosEnv" .Values.global.talosEnv) | trim | nindent 9 }}
      hostPID: true
      restartPolicy: Never
      volumes:
       - name: secret-volume
         secret:
           secretName: {{ .Values.global.secretName | default "jobs-token" }}
       - name: config
         configMap:
          name: cis-config-{{ .Release.Name }}
       {{- if eq (include "spire.enabled" . ) "true" }} 
       - name: spirepath
         emptyDir: {}
       {{- end }}
      {{- include "volumes" (dict "platform" .Values.global.cis.toolConfig.platform "targets" .Values.global.cis.toolConfig.targets "benchmark" .Values.global.cis.toolConfig.benchmark "check" .Values.global.cis.toolConfig.check "skip" .Values.global.cis.toolConfig.skip "talosEnv" .Values.global.talosEnv) | trim | nindent 7 }}