{{- $pageSize := toString .Values.global.riskAssessment.kubernetesPageSize -}}
{{- if not (regexMatch "^[1-9][0-9]*$" $pageSize) -}}
{{- fail "global.riskAssessment.kubernetesPageSize must be a positive integer" -}}
{{- end -}}
{{- $concurrency := toString .Values.global.riskAssessment.namespaceConcurrency -}}
{{- if not (regexMatch "^[1-9][0-9]*$" $concurrency) -}}
{{- fail "global.riskAssessment.namespaceConcurrency must be a positive integer" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-namespace-scan-config
  namespace: {{ .Release.Namespace }}
data:
  OUTPUT_PATH: {{ .Values.global.riskAssessment.outputPath | default "/data" | quote }}
  COMPLETED_REPORTS_PATH: {{ .Values.global.riskAssessment.completedReportsPath | default (printf "%s/completed" (.Values.global.riskAssessment.outputPath | default "/data" | trimSuffix "/")) | quote }}
  NAMESPACE_RESOURCES: {{ .Values.global.riskAssessment.namespaceResources | default "" | quote }}
  CLUSTER_RESOURCES: {{ .Values.global.riskAssessment.clusterResources | default "" | quote }}
  NAMESPACE_CONCURRENCY: {{ $concurrency | quote }}
  INCLUDE_CLUSTER_CONTEXT: {{ .Values.global.riskAssessment.includeClusterContext | default false | toString | quote }}
  KUBERNETES_PAGE_SIZE: {{ $pageSize | quote }}
  COLLECT_ALL_RESOURCES: {{ .Values.global.riskAssessment.collectAllResources | default false | toString | quote }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: risk-assessment-config-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  app.yaml : |
    {{ tpl ( .Files.Get "config/app.yaml" ) . | nindent 4 }}
  {{- if eq (include "spire.enabled" . ) "true" }}  
  agent.conf: |
    {{ tpl ( .Files.Get "config/agent.conf" ) . | nindent 4 }}
  {{- end }}  