apiVersion: batch/v1
kind: Job
metadata:
  name: k8s-risk-assessment-job-{{ now | unixEpoch }}
  namespace: {{ .Release.Namespace }}
spec:
  # keep the job for 2 hours after successful completion
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        job-name: k8s-risk-assessment-job-{{ now | unixEpoch }}
        app: scanner
    spec:
    {{- if .Values.global.registry.secretName }}
      imagePullSecrets:
      - name: {{ .Values.global.registry.secretName }}-k8s
    {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.global.tolerations }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.global.riskAssessment.largeCluster }}
      securityContext:
        fsGroup: 1000
      containers:
      {{- else }}
      initContainers:
      {{- end }}
        - name: job-init-container
          imagePullPolicy: IfNotPresent
          resources:
          {{- toYaml .Values.global.job.resources | nindent 12 }}
          image: "{{ include "kubescape.image" . }}"
          {{- if .Values.global.riskAssessment.largeCluster }}
          command: ["python3", "/usr/local/bin/scan-resources.py"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-namespace-scan-config
          {{- else }}
          command: ["python3", "/usr/local/bin/scan-control-namespaces.py"]
          {{- end }}
          env:
            - name: CLUSTER_NAME
              value: "{{ .Values.global.clusterName }}"
            - name: AIRGAPPED
              value: {{ .Values.global.airgapped | quote }}
            - name: CONTROLS_CONFIG_URL
              value: {{ .Values.global.kraCustomConfig | default "" | quote }}
            - name: SCAN_NAMESPACES
              value: {{ .Values.global.scanNamespaces | default (list) | toJson | quote }}
          volumeMounts:
            - name: datapath
              mountPath: /data
      {{- if not .Values.global.riskAssessment.largeCluster }}
      containers:
      {{- end }}
        - image: "{{ include "cluster_job.image" . }}"
          name: artifact-api-container
          args: 
          - -config 
          - /jobs/conf/app.yaml
          imagePullPolicy: IfNotPresent
          resources:
          {{- toYaml .Values.global.job.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data
              name: datapath
            - name: secret-volume
              mountPath: /secrets/tokens
              readOnly: true
            - name: config
              mountPath: /jobs/conf/app.yaml
              subPath: app.yaml
          {{- if .Values.global.certEnabled }}
            - name: certs
              mountPath: /certs
              readOnly: true
          {{- end }}            
            {{- if eq (include "spire.enabled" . ) "true" }}   
            - name: config
              mountPath: /jobs/spire/agent.conf
              subPath: agent.conf 
            - name: spirepath
              mountPath: /run/spire/agent
            {{- end }}
      volumes:
        - name: datapath
          emptyDir: {}
        - name: secret-volume
          secret:
            secretName: {{ .Values.global.secretName | default "jobs-token" }}
        - name: config
          configMap:
            name: risk-assessment-config-{{ .Release.Name }}
      {{- if .Values.global.certEnabled }}
        - name: certs
          secret:
            secretName: {{ .Values.global.certSecretName | default "jobs-cert" }}
      {{- end }}            
        {{- if eq (include "spire.enabled" . ) "true" }}
        - name: spirepath
          emptyDir: {}
        {{- end }}
      restartPolicy: OnFailure
      serviceAccount: k8s-risk-assessment-job-service-account
