apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-risk-assessment-job
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "{{ .Values.global.cronTab }}"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

  jobTemplate:
    metadata:
      labels:
        app: k8s-risk-assessment-job
    spec:
      template:
        metadata:
          labels:
            app: scanner
        spec:
        {{- if .Values.global.registry.secretName }}
          imagePullSecrets:
          - name: {{ .Values.global.registry.secretName }}-k8s
        {{- end }}
          {{- if .Values.global.nodeSelector }}
          nodeSelector:
            {{- toYaml .Values.global.nodeSelector | nindent 12 }}
          {{- end }}
          {{- if .Values.global.tolerations }}
          tolerations:
            {{- toYaml .Values.global.tolerations | nindent 12 }}
          {{- end }}
          initContainers:
            - name: job-init-container
              image: "{{ include "kubescape.image" . }}"
              {{- if .Values.global.kraCustomConfig }}
              command: ["/bin/sh", "-c"]
              args:
                - >
                  wget -O /tmp/controls.json '{{ .Values.global.kraCustomConfig }}' &&
                  kubescape scan framework
                  --exclude-namespaces openshift-ovn-kubernetes
                  --format json
                  --cache-dir /data/kubescape-cache
                  --output /data/report.json
                  --cluster-name=$CLUSTER_NAME
                  {{- if .Values.global.airgapped }}
                  --use-artifacts-from /opt/kubescape/artifacts
                  {{- end }}
                  --controls-config /tmp/controls.json
              {{- else }}
              command: ["kubescape"]
              args:
                - scan
                - framework
                - allcontrols,clusterscan,mitre,nsa
                - --exclude-namespaces
                - openshift-ovn-kubernetes
                - --format
                - json
                - --cache-dir
                - /data/kubescape-cache
                - --output
                - /data/report.json
                - --cluster-name=$(CLUSTER_NAME)
                {{- if .Values.global.airgapped }}
                - --use-artifacts-from
                - /opt/kubescape/artifacts
                {{- end }}
              {{- end }}
              env:
                - name: CLUSTER_NAME
                  value: "{{ .Values.global.clusterName }}"
              volumeMounts:
                - name: datapath
                  mountPath: /data
          containers:
            - image: "{{ include "cluster_job.image" . }}"
              name: artifact-api-container
              args: 
              - -config 
              - /jobs/conf/app.yaml
              imagePullPolicy: Always
              volumeMounts:
                - mountPath: /data
                  name: datapath
                - mountPath: /script
                  name: scriptpath
                - name: secret-volume
                  mountPath: /secrets/tokens
                  readOnly: true
                - name: config
                  mountPath: /jobs/conf/app.yaml
                  subPath: app.yaml
              {{- if .Values.global.certEnabled }}
                - name: certs
                  mountPath: /certs
                  readOnly: true
              {{- end }}              
                {{- if eq (include "spire.enabled" . ) "true" }}    
                - name: config
                  mountPath: /jobs/spire/agent.conf
                  subPath: agent.conf 
                - name: spirepath
                  mountPath: /run/spire/agent
                {{- end }}
          volumes:
            - name: datapath
              emptyDir: {}
            - name: scriptpath
              configMap:
                name: k8s-risk-assessment-job-script-configmap
            - name: secret-volume
              secret:
                secretName: {{ .Values.global.secretName | default "jobs-token" }}
            - name: config
              configMap:
                name: risk-assessment-config-{{ .Release.Name }}
          {{- if .Values.global.certEnabled }}
            - name: certs
              secret:
                secretName: {{ .Values.global.certSecretName | default "jobs-cert" }}
          {{- end }}                
            {{- if eq (include "spire.enabled" . ) "true" }}   
            - name: spirepath
              emptyDir: {}
            {{- end }}
          restartPolicy: OnFailure
          serviceAccount: k8s-risk-assessment-job-service-account