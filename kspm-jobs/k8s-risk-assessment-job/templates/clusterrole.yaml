apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-k8s-assessment-crole
rules:
  {{- if or .Values.global.riskAssessment.collectAllResources .Values.global.riskAssessment.namespaceResources .Values.global.riskAssessment.clusterResources }}
  # All-resource and configurable selection modes support arbitrary/custom resource types.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list"]
  {{- end }}
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "serviceaccounts", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list"]
  # Kubescape loads namespace and cluster security exceptions during file scans.
  - apiGroups: ["kubescape.io"]
    resources: ["securityexceptions", "clustersecurityexceptions"]
    verbs: ["get", "list", "watch"]
  # API discovery for optional exception CRDs and served resource versions.
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
  # Kubescape emits audit Events when a security exception matches a finding.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
