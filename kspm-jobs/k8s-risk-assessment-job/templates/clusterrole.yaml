apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-k8s-assessment-crole
rules:
  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/proxy
      - namespaces
      - nodes
      - configmaps
      - services
      - serviceaccounts
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - limitranges
      - replicationcontrollers
      - podtemplates
      - resourcequotas
      - events
      - secrets
    verbs:
      - get
      - list
      - watch

  # Admission
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs:
      - get
      - list
      - watch

  # API registration
  - apiGroups:
      - apiregistration.k8s.io
    resources:
      - apiservices
    verbs:
      - get
      - list
      - watch

  # API extensions / CRDs
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch

  # Workloads
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - controllerrevisions
    verbs:
      - get
      - list
      - watch

  # Autoscaling
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch

  # Batch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch

  # Coordination
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch

  # Discovery
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  # Events
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - get
      - list
      - watch

  # Kubescape host data
  - apiGroups:
      - hostdata.kubescape.cloud
    resources:
      - apiserverinfos
      - controlplaneinfos
      - osreleasefiles
      - kernelversions
      - linuxsecurityhardeningstatuses
      - openportslists
      - linuxkernelvariables
      - kubeletinfos
      - kubeproxyinfos
      - cloudproviderinfos
      - cniinfos
    verbs:
      - get
      - list
      - watch

  # Kubernetes networking
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
      - ingresses
    verbs:
      - get
      - list
      - watch

  # Legacy extensions networking
  - apiGroups:
      - extensions
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch

  # Cilium
  - apiGroups:
      - cilium.io
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
    verbs:
      - get
      - list
      - watch

  # Calico
  - apiGroups:
      - projectcalico.org
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch

  # Istio
  - apiGroups:
      - networking.istio.io
    resources:
      - gateways
      - virtualservices
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - security.istio.io
    resources:
      - authorizationpolicies
    verbs:
      - get
      - list
      - watch

  # Pod security / disruption
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
      - podsecuritypolicies
    verbs:
      - get
      - list
      - watch

  # RBAC
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch

  # Storage
  - apiGroups:
      - storage.k8s.io
    resources:
      - csistoragecapacities
      - storageclasses
      - volumeattachments
      - csinodes
    verbs:
      - get
      - list
      - watch

  # Scheduling
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - get
      - list
      - watch

  # Certificates
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests
    verbs:
      - get
      - list
      - watch

  # Gateway API
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
      - gateways
      - gatewayclasses
      - tcproutes
      - tlsroutes
      - udproutes
    verbs:
      - get
      - list
      - watch

  # Kubescape workload scan results
  - apiGroups:
      - spdx.softwarecomposition.kubescape.io
    resources:
      - workloadconfigurationscans
      - workloadconfigurationscansummaries
    verbs:
      - create
      - get
      - update
      - patch

  # Kubescape service scan results
  - apiGroups:
      - kubescape.io
    resources:
      - servicesscanresults
    verbs:
      - get
      - list
      - watch

  # Agent runtime posture
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxtemplates
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ate.dev
    resources:
      - actortemplates
      - workerpools
    verbs:
      - get
      - list
      - watch

  # Risk acceptance
  - apiGroups:
      - kubescape.io
    resources:
      - securityexceptions
      - clustersecurityexceptions
    verbs:
      - get
      - list
      - watch

  # Required when risk acceptance is enabled
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch