jobs:
  {{- if .Values.global.authToken }}
  authTokenFile: {{ .Values.authTokenPath }}
  {{- end }}
  url: https://{{ include "global.jobURL" . }}/api/v1/artifact/?tenant_id={{ .Values.global.tenantId }}&data_type=KS&label_id={{ .Values.global.label }}&save_to_s3=true
  tenantID: {{ .Values.global.tenantId }}
  clusterName: {{ include "jobs.clusterName" . | quote }}
  labelName: {{ .Values.global.label }}
  dataType: "KS"
  saveToS3: true
  reportFile: "/data/report.json"
  clusterID: {{ .Values.global.clusterID }}
  printData: true
  insecure: {{ .Values.global.skipTLSVerification }}
  {{- if .Values.global.certEnabled }}
  caPath: /certs/tls.crt
  caUrl: {{ .Values.global.certURL | quote }}
  {{- end }}

spire:
  enabled: {{ include "spire.enabled" . }}
  server: {{ include "jobs.spireHost" . }}
  port: {{ .Values.global.OnePort | default (.Values.global.spirePort | default .Values.spirePort) }}
  secretName: {{ .Values.global.spire.secretName }}
  joinTokenFile: {{ .Values.joinTokenPath }}
  namespace: "{{ .Release.Namespace }}"
  gatewayServer: {{ include "jobs.knoxGatewayHost" . }}
  directory: ""
  configFile: {{ .Values.spireConfigFile }}
  clusterName: {{ include "jobs.clusterName" . | quote }}
  accessKeyUrl: {{ include "jobs.accessKeyUrl" . }}
  trustBundleUrl: "{{ .Values.global.spire.trustBundleUrl }}"
  accessKeyFile: {{ .Values.accessKeyPath }}
  agent: {{ include "spire.agent" . }}

configPaths:
{{- range .Values.configPaths }}
  - {{ . }}
{{- end }}
