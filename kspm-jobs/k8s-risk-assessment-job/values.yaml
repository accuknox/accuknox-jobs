# Default values for k8s-risk-assessment-job.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

registryName: docker.io/seswarrajan
#registryName: public.ecr.aws/k9v9d5v2

kubescape:
  repository: k8s-risk-assessment
  tag: "v0.3.16"
  image: ""
  pullPolicy: Always


knoxjobs:
  image: docker.io/seswarrajan/knoxjobs:v0.1.11
  pullPolicy: Always
  binaryPath: /home/jobs/job
  resources:
    requests:
      memory: 500Mi
    limits:
      memory: 1Gi

includeClusterScoped: false
namespaceConcurrency: 1
scannerMemory:
  # Combined Go budget as a percentage of the scanner container's memory limit.
  percent: 60
  gogc: 20

replicaCount: 1

global:
  # Optional full artifact HTTP endpoint; otherwise use the existing SaaS host settings.
  artifactURL: ""
  job:
    resources:
      requests:
        memory: 500Mi
      limits:
        memory: 1Gi

  authToken: ""
  enableJobsUrl: false
  tenantId: ""
  cronTab: ""
  clusterName: ""
  clusterID: 0
  label: ""
  secretName: ""
  airgapped: false

  certEnabled: false   #Set this for cert need to be enabled
  certSecretName: ""  #we need to pass a secret name the cert will be stored in this secret.
  certPath: ""  # Set this for cert local path if needed .
  certURL: ""  # Set this for cert URL if needed (if certPath is set as well certPath will take precedent)
  skipTLSVerification: false  # Set to true if insecure connection is needed

  nodeSelector: {} # Node selector for scheduling the job --set nodeSelector."kubernetes.io/os"=linux
  tolerations: [] # Tolerations for scheduling pods on tainted nodes e.g. --set global.tolerations[0].key=dedicated --set global.tolerations[0].operator=Equal --set global.tolerations[0].value=accuknox --set global.tolerations[0].effect=NoSchedule

  # To use existing secret updated {global.registry.secretName} with your secret name.
  registry:
    url: ""
    secretName: ""
    username: ""
    password: ""
    preserveUpstream: true

authTokenPath: "/secrets/tokens/AUTH_TOKEN"
