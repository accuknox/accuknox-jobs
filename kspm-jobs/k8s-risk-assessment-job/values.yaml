# Default values for k8s-risk-assessment-job.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

registryName: public.ecr.aws/k9v9d5v2

cluster_job:
  repository: knoxjobs
  tag: "v0.1.14"
  image: ""

kubescape:
  repository: k8s-risk-assessment
  tag: "v0.3.11"
  image: ""
  # Scanner image tag used when global.riskAssessment.largeCluster=true.
  newTag: "v0.3.17"


replicaCount: 1

global:
  jobs:
    # Per-report SaaS upload timeout; job-specific flushTimeout takes precedence.
    flushTimeout: "10m"
  riskAssessment:
    # Run the scanner as a regular container using kubescape.newTag.
    largeCluster: false
    # Empty inherits global.jobs.flushTimeout. Set e.g. "5m" to override.
    flushTimeout: ""
    # Directory for scan reports, consolidated results and temporary scan inputs.
    outputPath: /data
    # Empty defaults to <outputPath>/completed; all *-report.json here are merged.
    completedReportsPath: ""

    # Comma-separated types; empty uses the existing baseline lists.
    # collectAllResources=true overrides both lists. Custom types support resource.group.
    namespaceResources: ""
    clusterResources: ""

    # Experimental: discover all listable namespaced and cluster resource types, including CRDs.
    collectAllResources: false

    # Initial namespace worker allowance; scan processes themselves start at 1.
    namespaceConcurrency: 1
    # Allow an initial allowance of 1 to grow as the memory scheduler permits.
    autoNamespaceConcurrency: true
    maxNamespaceConcurrency: 5

    # Default 0 evaluates frameworks together, avoiding per-control startup overhead.
    # Memory failures automatically halve control batches down to one control.
    # Each batch retains the complete namespace manifest and selected cluster context.
    controlBatchSize: 0
    # Auto uses 80% of the memory budget divided by scan concurrency.
    # Set a Go memory size (e.g. "600MiB") to apply a lower per-process cap.
    goMemLimit: "auto"
    # GC heap-growth percentage; independent of the container memory size.
    goGC: "50"

    # Grow the scanner's software budget within global.job.resources.limits.memory.
    # The Kubernetes container limit itself is never changed automatically.
    autoGrowMemory: true
    # Initial memory budget uses global.job.resources.limits.memory, or 1Gi if unset.

    # Include cluster snapshots in namespace scans for relationship checks.
    includeClusterContext: true

    # Parse each raw scan report to validate JSON before auditing and publishing.
    # Disable to measure the cost of this extra report pass.
    validateReports: false

    # Positive number of items requested per Kubernetes list page.
    kubernetesPageSize: 250

  job:
    resources:
      requests:
        memory: 500Mi
      limits:
        memory: 1Gi

  authToken: ""
  enableJobsUrl: false
  tenantId: ""
  cronTab: ""
  clusterName: ""
  clusterID: 0
  label: ""
  secretName: ""
  airgapped: false
  joinToken: ""
  accessKey: ""

  spire:
    secretName: "spire-agent-secret"

  certEnabled: false   #Set this for cert need to be enabled
  certSecretName: ""  #we need to pass a secret name the cert will be stored in this secret.
  certPath: ""  # Set this for cert local path if needed .
  certURL: ""  # Set this for cert URL if needed (if certPath is set as well certPath will take precedent)
  skipTLSVerification: false  # Set to true if insecure connection is needed

  nodeSelector: {} # Node selector for scheduling the job --set nodeSelector."kubernetes.io/os"=linux
  tolerations: [] # Tolerations for scheduling pods on tainted nodes e.g. --set global.tolerations[0].key=dedicated --set global.tolerations[0].operator=Equal --set global.tolerations[0].value=accuknox --set global.tolerations[0].effect=NoSchedule

  # To use existing secret updated {global.registry.secretName} with your secret name.
  registry:
    url: ""
    secretName: ""
    username: ""
    password: ""
    preserveUpstream: true

authTokenPath: "/secrets/tokens/AUTH_TOKEN"
joinTokenPath: "/secrets/tokens/JOIN_TOKEN"
accessKeyPath: "/secrets/tokens/ACCESS_KEY"


spirePort: 443
spireConfigFile: "/jobs/spire/agent.conf"


configPaths:
- "/data/kubescape-cache/allcontrols.json"
- "/data/kubescape-cache/mitre.json"
- "/data/kubescape-cache/nsa.json"
