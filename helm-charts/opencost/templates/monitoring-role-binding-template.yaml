{{- if and .Values.platforms.openshift.enabled .Values.platforms.openshift.createMonitoringResourceReaderRoleBinding }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ include "opencost.namespace" . }}
  name: {{ include "opencost.fullname" . }}-reader
subjects:
- kind: ServiceAccount
  name: {{ .Values.platforms.openshift.monitoringServiceAccountName | quote }}
  namespace: {{ .Values.platforms.openshift.monitoringServiceAccountNamespace | quote }}
roleRef:
  kind: Role
  name: {{ include "opencost.fullname" . }}-reader
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
