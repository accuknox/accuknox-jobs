{{- include  "isPrometheusConfigValid" . }}
{{- include  "kubeRBACProxyBearerTokenCheck" . }}
{{ include "opencost.caCertsSecretConfig.check" . }}
{{ include "opencost.cloudIntegration.secretConfigCheck" . }}
{{ include "opencost.plugins.configCheck" . }}
{{- $cloudIntegrationSecretName := include "opencost.cloudIntegration.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencost.fullname" . }}
  namespace: {{ include "opencost.namespace" . }}
  labels: {{- include "opencost.labels" . | nindent 4 }}
  annotations:
    checksum/configs: {{ include "configsChecksum" . }}
    {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.exporter.replicas }}
  selector:
    matchLabels: {{- include "opencost.selectorLabels" . | nindent 6 }}
  strategy: {{ toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "opencost.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ template "opencost.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.podAutomountServiceAccountToken }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with.Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if (and .Values.plugins.enabled .Values.plugins.install.enabled ) }}
        - name: plugin-installer
          image: {{ .Values.plugins.install.fullImageName }}
          command: ["sh", "/install/install_plugins.sh"]
          {{- with .Values.plugins.install.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: install-script
              mountPath: /install
            - name: plugins-dir
              mountPath: {{ .Values.plugins.folder }}
        {{- end }}
        {{- if .Values.updateCaTrust.enabled }}
        - name: update-ca-trust
          image: {{ include "opencost.fullImageName" . }}
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          {{- with .Values.updateCaTrust.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.updateCaTrust.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - 'sh'
            - '-c'
            - >
              mkdir -p /etc/ssl/certs;
              update-ca-certificates;
          volumeMounts:
            - name: ca-certs-secret
              mountPath: "/usr/local/share/ca-certificates"
              readOnly: true
            - name: ssl-path
              mountPath: "/etc/ssl/certs"
              readOnly: false
          {{- end}}
      containers:
        - name: {{ include "opencost.fullname" . }}
          image: {{ include "opencost.fullImageName" . }}
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          {{- with .Values.exporter.command }}
          {{- if . }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          args:
          {{- range .Values.exporter.extraArgs }}
          - --{{ . }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.exporter.apiPort }}
              name: http
            {{- if .Values.mcp.enabled }}
            - containerPort: {{ .Values.mcp.port }}
              name: mcp-server
            {{- end }}
          resources: {{- toYaml .Values.exporter.resources | nindent 12 }}
          {{- if .Values.exporter.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.exporter.startupProbe.path }}
              port: {{ .Values.exporter.apiPort }}
            initialDelaySeconds: {{ .Values.exporter.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.exporter.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.exporter.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.exporter.startupProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.exporter.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.exporter.livenessProbe.path }}
              port: {{ .Values.exporter.apiPort }}
            initialDelaySeconds: {{ .Values.exporter.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.exporter.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.exporter.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.exporter.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.exporter.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.exporter.readinessProbe.path }}
              port: {{ .Values.exporter.apiPort }}
            initialDelaySeconds: {{ .Values.exporter.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.exporter.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.exporter.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.exporter.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.exporter.readinessProbe.successThreshold }}
          {{- end }}
          {{- with .Values.exporter.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.loglevel }}
            - name: CUSTOM_COST_ENABLED
              value: {{ .Values.plugins.enabled | quote }}
            - name: INSTALL_NAMESPACE
              value: {{ include "opencost.namespace" . }}
            {{- with .Values.exporter.prometheusDataSource }}
            {{- if .queryResolutionSeconds }}
            - name: PROMETHEUS_QUERY_RESOLUTION_SECONDS
              value: {{ .queryResolutionSeconds | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.exporter.collectorDataSource }}
            {{- if .enabled }}
            - name: COLLECTOR_DATA_SOURCE_ENABLED
              value: "true"
            {{- if .scrapeInterval }}
            - name: COLLECTOR_SCRAPE_INTERVAL
              value: {{ .scrapeInterval | quote }}
            {{- end }}
            {{- if .networkPort }}
            - name: NETWORK_PORT
              value: {{ .networkPort | quote }}
            {{- end }}
            {{- if .retention10m }}
            - name: COLLECTOR_RESOLUTION_10M_RETENTION
              value: {{ .retention10m | quote }}
            {{- end }}
            {{- if .retention1h }}
            - name: COLLECTOR_RESOLUTION_1H_RETENTION
              value: {{ .retention1h | quote }}
            {{- end }}
            {{- if .retention1d }}
            - name: COLLECTOR_RESOLUTION_1D_RETENTION
              value: {{ .retention1d | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.config.enabled }}
            - name: METRICS_CONFIGMAP_NAME
              value: {{ .Values.metrics.config.configmapName }}
            {{- end }}
            {{- if .Values.exporter.apiPort }}
            - name: API_PORT
              value: {{ .Values.exporter.apiPort | quote }}
            {{- end }}
            {{- if .Values.carbonCost.enabled }}
            - name: CARBON_ESTIMATES_ENABLED
              value: {{ .Values.carbonCost.enabled | quote }}
            {{- end }}
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: {{ include "opencost.prometheusServerEndpoint" . | quote }}
            - name: INSECURE_SKIP_VERIFY
              value: {{ .Values.prometheus.insecureSkipVerify | quote }}
            {{- if .Values.exporter.cloudProviderApiKey }}
            - name: CLOUD_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencost.prometheus.secretname" . }}
                  key: CLOUD_PROVIDER_API_KEY
            {{- end }}
            {{- if and (.Values.exporter.defaultClusterId) (not .Values.exporter.clusterIdConfigmap) }}
            - name: CLUSTER_ID
              value: {{ .Values.exporter.defaultClusterId | quote }}
            {{- end }}
            {{- if .Values.exporter.clusterIdConfigmap }}
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.exporter.clusterIdConfigmap }}
                  key: CLUSTER_ID
            {{- end }}
            {{- if .Values.exporter.aws.access_key_id }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencost.prometheus.secretname" . }}
                  key: AWS_ACCESS_KEY_ID
            {{- end }}
            {{- if .Values.exporter.aws.secret_access_key }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencost.prometheus.secretname" . }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
            {{- if and .Values.prometheus.username_key (or .Values.prometheus.username .Values.prometheus.existingSecretName) }}
            - name: DB_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prometheus.existingSecretName | default (include "opencost.prometheus.secretname" .) }}
                  key: {{ .Values.prometheus.username_key }}
            {{- end }}
            {{- if and .Values.prometheus.password_key (or .Values.prometheus.password .Values.prometheus.existingSecretName) }}
            - name: DB_BASIC_AUTH_PW
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prometheus.existingSecretName | default (include "opencost.prometheus.secretname" .) }}
                  key: {{ .Values.prometheus.password_key }}
            {{- else if and .Values.prometheus.bearer_token_key (or .Values.prometheus.bearer_token .Values.prometheus.existingSecretName) }}
            - name: DB_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prometheus.existingSecretName | default (include "opencost.prometheus.secretname" .) }}
                  key: {{ .Values.prometheus.bearer_token_key }}
            {{- end }}
            {{- if .Values.prometheus.kubeRBACProxy }}
            - name: KUBE_RBAC_PROXY_ENABLED
              value: {{ (quote .Values.prometheus.kubeRBACProxy) }}
            {{- end }}
            {{- if  .Values.exporter.persistence.enabled }}
            - name: PV_MOUNT_PATH
              value: {{ (.Values.exporter.persistence.mountPath | default "mnt/export") | quote }}
            {{- end }}
            {{- if .Values.exporter.csv_path }}
            - name: EXPORT_CSV_FILE
              value: {{ .Values.exporter.csv_path | quote }}
            {{- end }}
            {{- if .Values.prometheus.thanos.enabled }}
            - name: THANOS_ENABLED
              value: 'true'
            - name: THANOS_QUERY_URL
              value: {{ include "opencost.thanosServerEndpoint" . | quote }}
            {{- end }}
            {{- if .Values.prometheus.thanos.queryOffset }}
            - name: THANOS_QUERY_OFFSET
              value: {{ .Values.prometheus.thanos.queryOffset | quote }}
            {{- end }}
            {{- if .Values.prometheus.thanos.maxSourceResolution }}
            - name: THANOS_MAX_SOURCE_RESOLUTION
              value: {{ .Values.prometheus.thanos.maxSourceResolution | quote }}
            {{- end }}
            {{- with .Values.exporter.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- $external := .Values.external | default dict }}
            {{- $nodeLabels := $external.nodeLabels | default dict }}
            {{- if $nodeLabels.configMapName }}
            - name: EXTERNAL_NODELABELS_CONFIG_MAP_NAME
              value: {{ $nodeLabels.configMapName | quote }}
            {{- if $nodeLabels.namespace }}
            - name: EXTERNAL_NODELABELS_NAMESPACE
              value: {{ $nodeLabels.namespace | quote }}
            {{- end }}
            {{- if $nodeLabels.key }}
            - name: EXTERNAL_NODELABELS_KEY
              value: {{ $nodeLabels.key | quote }}
            {{- end }}
            {{- if $nodeLabels.route }}
            - name: EXTERNAL_NODELABELS_ROUTE
              value: {{ $nodeLabels.route | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.customPricing.enabled }}
            - name: CONFIG_PATH
              value: {{ .Values.customPricing.configPath | quote }}
            - name: PRICING_CONFIGMAP_NAME
              value: {{ .Values.customPricing.configmapName | quote }}
            {{- end }}
            - name: RESOLUTION_1D_RETENTION
            {{- if (.Values.dataRetention).dailyResolutionDays}}
              value: {{ .Values.dataRetention.dailyResolutionDays | quote }}
            {{- else }}
              value: {{ .Values.retention1d | quote }}
            {{- end }}
            - name: RESOLUTION_1H_RETENTION
              value: {{ .Values.retention1h | quote }}
            - name: CLOUD_COST_ENABLED
              value: {{ .Values.cloudCost.enabled | quote }}
            - name: CLOUD_COST_MONTH_TO_DATE_INTERVAL
              value: {{ .Values.cloudCost.monthToDateInterval | quote }}
            - name: CLOUD_COST_REFRESH_RATE_HOURS
              value: {{ .Values.cloudCost.refreshRateHours | quote }}
            - name: CLOUD_COST_QUERY_WINDOW_DAYS
              value: {{ .Values.cloudCost.queryWindowDays | quote }}
            - name: CLOUD_COST_RUN_WINDOW_DAYS
              value: {{ .Values.cloudCost.runWindowDays | quote }}
            {{- if not (quote .Values.metrics.kubeStateMetrics.emitPodAnnotations | empty ) }}
            - name: EMIT_POD_ANNOTATIONS_METRIC
              value: {{ .Values.metrics.kubeStateMetrics.emitPodAnnotations | quote }}
            {{- end }}
            {{- if not (quote .Values.metrics.kubeStateMetrics.emitNamespaceAnnotations | empty ) }}
            - name: EMIT_NAMESPACE_ANNOTATIONS_METRIC
              value: {{ .Values.metrics.kubeStateMetrics.emitNamespaceAnnotations | quote }}
            {{- end }}
            {{- if not (quote .Values.metrics.kubeStateMetrics.emitKsmV1Metrics | empty ) }}
            - name: EMIT_KSM_V1_METRICS
              value: {{ .Values.metrics.kubeStateMetrics.emitKsmV1Metrics | quote }}
            {{- end }}
            {{- if not (quote .Values.metrics.kubeStateMetrics.emitKsmV1MetricsOnly | empty ) }}
            - name: EMIT_KSM_V1_METRICS_ONLY
              value: {{ .Values.metrics.kubeStateMetrics.emitKsmV1MetricsOnly | quote }}
            {{- end }}
            {{- if .Values.exporter.inferenceCostTracking.enabled }}
            # Inference Cost Tracking Configuration
            - name: INFERENCE_COST_ENABLED
              value: "true"
            - name: INFERENCE_MODEL_LABEL
              value: {{ .Values.exporter.inferenceCostTracking.modelLabel | quote }}
            - name: INFERENCE_SHARED_INFRA_LABEL
              value: {{ .Values.exporter.inferenceCostTracking.sharedInfraLabel | quote }}
            - name: INFERENCE_SHARED_INFRA_LABEL_VALUE
              value: {{ .Values.exporter.inferenceCostTracking.sharedInfraLabelValue | quote }}
            - name: INFERENCE_COLLECTION_INTERVAL
              value: {{ .Values.exporter.inferenceCostTracking.collectionInterval | quote }}
            {{- end }}
            # Add any additional provided variables
            {{- range $key, $value := .Values.exporter.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if and .Values.exporter.adminToken.enabled (or .Values.exporter.adminToken.value .Values.exporter.adminToken.existingSecret) }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exporter.adminToken.existingSecret | default (printf "%s-admin-token" (include "opencost.fullname" .)) }}
                  key: {{ .Values.exporter.adminToken.secretKey | default "ADMIN_TOKEN" }}
            {{- end }}
            {{- if .Values.mcp.enabled }}
            # MCP Server Configuration
            - name: MCP_SERVER_ENABLED
              value: "true"
            - name: MCP_HTTP_PORT
              value: {{ .Values.mcp.port | quote }}
            {{- else }}
            - name: MCP_SERVER_ENABLED
              value: "false"
            {{- end }}
          {{- with .Values.exporter.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.plugins.enabled .Values.exporter.persistence.enabled .Values.exporter.extraVolumeMounts .Values.customPricing.enabled .Values.metrics.config.enabled $cloudIntegrationSecretName .Values.updateCaTrust.enabled}}
          volumeMounts:
            {{- if .Values.plugins.enabled }}
            - mountPath: /opt/opencost/plugin
              name: plugins-dir
              readOnly: false
            {{- $pluginList := include "opencost.plugins.installList" . | fromYamlArray }}
            {{- range $key := $pluginList }}
            - mountPath: /opt/opencost/plugin/config/{{$key}}_config.json
              subPath: {{$key}}_config.json
              name: plugins-config
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.exporter.persistence.enabled }}
            - mountPath: {{ (.Values.exporter.persistence.mountPath | default "mnt/export") }}
              name: opencost-export
              readOnly: false
            {{- end }}
            {{- if or .Values.customPricing.enabled .Values.metrics.config.enabled }}
            - mountPath: {{ .Values.customPricing.configPath }}
              name: custom-configs
            {{- end }}
            {{- if $cloudIntegrationSecretName }}
            - name: var-configs
              mountPath: /var/configs
            - name: cloud-integration
              mountPath: /var/configs/cloud-integration.json
              subPath: cloud-integration.json
              readOnly: true
            {{- end }}
            {{- if .Values.updateCaTrust.enabled }}
            - name: ca-certs-secret
              mountPath: "/usr/local/share/ca-certificates"
              readOnly: true
            - name: ssl-path
              mountPath: "/etc/ssl/certs"
              readOnly: false
            {{- end }}
            {{- with .Values.exporter.extraVolumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- if .Values.ui.enabled }}
        - name: opencost-ui
          image: {{ include "opencostUi.fullImageName" .}}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ui.uiPort }}
              name: http-ui
          env:
            {{- with .Values.ui.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.ui.apiServer }}
            - name: API_SERVER
              value: {{ .Values.ui.apiServer | quote }}
            {{- end }}
            {{- if .Values.exporter.apiPort }}
            - name: API_PORT
              value: {{ .Values.exporter.apiPort | quote }}
            {{- end }}
            {{- if .Values.ui.uiPort }}
            - name: UI_PORT
              value: {{ .Values.ui.uiPort | quote }}
            {{- end }}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          {{- if .Values.ui.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ui.livenessProbe.path }}
              port: {{ .Values.ui.uiPort }}
            initialDelaySeconds: {{ .Values.ui.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.ui.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.ui.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.ui.readinessProbe.path }}
              port: {{ .Values.ui.uiPort }}
            initialDelaySeconds: {{ .Values.ui.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.ui.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.ui.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          {{- with .Values.ui.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
            - name: opencost-ui-nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.nginx.conf
              subPath: default.nginx.conf
              readOnly: true
            {{- if .Values.platforms.openshift.enabled }}
            - name: empty-var-www
              mountPath: /var/www
            {{- end }}
        {{- end }}
        {{- with .Values.extraContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.prometheus.amp.enabled .Values.sigV4Proxy }}
        - name: sigv4proxy
          image: {{ .Values.sigV4Proxy.image }}
          imagePullPolicy: {{ .Values.sigV4Proxy.imagePullPolicy }}
          args:
          - --name
          - {{ .Values.sigV4Proxy.name }}
          - --region
          - {{ .Values.sigV4Proxy.region }}
          - --host
          - {{ .Values.sigV4Proxy.host }}
          {{- if .Values.sigV4Proxy.role_arn }}
          - --role-arn
          - {{ .Values.sigV4Proxy.role_arn }}
          {{- end }}
          - --port
          - :{{ .Values.sigV4Proxy.port }}
          ports:
          - name: aws-sigv4-proxy
            containerPort: {{ .Values.sigV4Proxy.port | int }}
          {{- with .Values.sigV4Proxy.extraEnv }}
          env:
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.sigV4Proxy.resources }}
          resources:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sigV4Proxy.securityContext }}
          securityContext:
          {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if or .Values.plugins.enabled .Values.exporter.persistence.enabled .Values.extraVolumes .Values.customPricing.enabled .Values.metrics.config.enabled $cloudIntegrationSecretName .Values.ui.enabled .Values.updateCaTrust.enabled }}
      volumes:
        {{- if .Values.plugins.enabled  }}
        {{- if .Values.plugins.install.enabled}}
        - name: install-script
          configMap:
            name: {{ template "opencost.fullname" . }}-install-plugins
        {{- end }}
        - name: plugins-dir
          emptyDir: {}
        - name: plugins-config
          secret:
            secretName: {{ include "opencost.pluginsConfigSecretName" . }}
        {{- end }}
        {{- if or .Values.customPricing.enabled .Values.metrics.config.enabled }}
        - name: custom-configs
          emptyDir: {}
        {{- end }}
        {{- if .Values.exporter.persistence.enabled }}
        - name: opencost-export
          persistentVolumeClaim:
            claimName: {{ include "opencost.fullname" . }}-pvc
        {{- end }}
        {{- if $cloudIntegrationSecretName }}
        - name: var-configs
          emptyDir: {}
        - name: cloud-integration
          secret:
            secretName: {{ $cloudIntegrationSecretName }}
            items:
              - key: cloud-integration.json
                path: cloud-integration.json
        {{- end }}
        {{- if .Values.ui.enabled }}
        - name: opencost-ui-nginx-config-volume
          configMap:
            name: opencost-ui-nginx-config
            items:
              - key: nginx.conf
                path: default.nginx.conf
        {{- if .Values.platforms.openshift.enabled }}
        - name: empty-var-www
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if .Values.updateCaTrust.enabled }}
        - name: ca-certs-secret
          {{- if .Values.updateCaTrust.caCertsSecret }}
          secret:
            defaultMode: 420
            secretName: {{ .Values.updateCaTrust.caCertsSecret }}
          {{- else }}
          configMap:
            name: {{ .Values.updateCaTrust.caCertsConfig }}
          {{- end }}
        - name: ssl-path
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
